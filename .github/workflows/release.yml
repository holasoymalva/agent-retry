name: Publish packages

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Use an npm CLI compatible with trusted publishing
        run: npm install --global "npm@^11.5.1"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:pack
      - name: Publish with Changesets and npm OIDC
        run: pnpm changeset publish --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
      - name: Push package tags
        run: git push --follow-tags
